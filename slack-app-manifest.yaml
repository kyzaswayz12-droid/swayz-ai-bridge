display_information:
  name: Swayz AI Bridge
  description: Controlled Slack bridge for explicitly routed AI requests
  background_color: "#16324f"
features:
  bot_user:
    display_name: Swayz AI Bridge
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
settings:
  event_subscriptions:
    request_url: https://swayz-ai-bridge.duckdns.org/slack/events
    bot_events:
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
